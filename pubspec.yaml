name: buyonce
description: "Shared shopping list for two."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  google_sign_in: 7.2.0
  cloud_firestore: 7.1.0
  firebase_messaging: ^17.0.1
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-Montserrat.txt

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VF.ttf
